version: "v0.4"

project:
  name: finite-etale-algebras
  description: >-
    Finite etale subalgebra constructions over fields, spectrum component bounds
    over separably closed fields, and literal subalgebra reconstruction along
    finite Galois, separable-closure and purely inseparable field extensions.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Algebraic Groups
    authors:
      - James S. Milne
    type: book
    location: >-
      2017 edition, Propositions 1.29 and 1.30; the separable-closure paragraph
      in the proof of Proposition 1.30(a) is on printed page 15 of iAG2017.pdf.
    relationship: background
    note: >-
      Motivates the algebraic subalgebra and descent questions. This library does
      not claim the complete scheme propositions or complete source coverage.
      The book is not bundled, and no source-author endorsement is claimed.
  - title: Semilinear finite-etale subalgebra reconstruction
    authors:
      - Formal Frontier Agents
    type: project mathematical exposition
    relationship: adapts
    note: >-
      Earlier original project exposition by a Formalization Worker A execution,
      followed by separate finite-Galois and finite-stage Lean implementations.
      The finite-Galois code uses Dedekind independence for the trace-dual
      identity rather than the exposition's matrix argument. The exposition is
      not bundled; exact predecessor and execution provenance remains in the
      development records. Contributor roles are preserved in README.md.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    relationship: builds-on
    note: >-
      Pinned external dependency. Reuses finite-dimensional algebra, tensor
      product, etale/descent, Galois/trace, purely inseparable and spectrum APIs.
      Upstream contributor credit and license notices remain distinct.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned mathlib,
        repository tools and independent non-author agent review.
  notes: >-
    AI-assisted development under human project direction. No model identity,
    expenditure, elapsed-time total or human mathematical review is asserted.

status:
  scope: >-
    Reusable field-base commutative-algebra APIs and ordinary-public-import
    examples. Ambient commutative algebras may be zero or nonreduced. Greatest
    finite etale subalgebras require a supplied uniform natural-number rank
    bound; spectrum results require a separably closed base. Reconstruction
    retains its stated finite-Galois, separable-closure or purely inseparable
    extension hypotheses, including a separably closed larger field for the
    purely inseparable finite-etale reconstruction. Complete source formalization
    is not claimed; release acceptance and publication are recorded separately.

review:
  status: agent-reviewed
  notes: >-
    The existing mathematical code and public-module/persistent-example migration
    have independent non-author agent development reviews, including proof-style
    cleanup and a scoped review of the later theorem-hypothesis generalization
    and persistent migration clients. Native-generated Markdown API documentation
    binds the mathematical sources and pins identified in docs/native-input.json.
    These development reviews do not by themselves approve the complete final
    artifact, redistribution rights or release. Exact-candidate verification,
    independent artifact/rights review, acceptance and publication have separate
    records. Agent review is not human review or source-author endorsement;
    schema validity does not certify any of those conditions.

acknowledgements: >-
  Collective project credit is supplemented by the Lattice and Formalization
  Worker A/B contribution roles in README.md, plus Anchor's original project
  documentation recipe adapted by Lattice. Earlier mathematical development
  is distinguished from later Lean assembly. Mathlib and other external tools
  retain their own attribution, license terms and notices.
