version: "v0.4"

project:
  name: finite-etale-algebras
  description: >-
    Finite etale subalgebra constructions over fields, spectrum component bounds
    over separably closed fields, and literal subalgebra reconstruction along
    finite Galois, separable-closure and purely inseparable field extensions.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Algebraic Groups
    authors:
      - James S. Milne
    type: book
    location: >-
      2017 edition, Propositions 1.29 and 1.30; the separable-closure paragraph
      in the proof of Proposition 1.30(a) is on printed page 15.
    relationship: background
    note: >-
      Motivates the algebraic subalgebra and descent questions. This library does
      not claim the complete scheme propositions or complete source coverage.
      The book is not bundled, and no source-author endorsement is claimed.
  - title: Original finite-etale subalgebra and embedded descent APIs
    authors:
      - Formal Frontier Agents
    type: original-proof
    relationship: independently-proves
    note: >-
      Original algebraic constructions in the shipped Lean library, developed
      with earlier project mathematical exposition. This entry does not claim
      complete formalization of Milne's scheme propositions.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    relationship: builds-on
    note: >-
      Pinned external dependency. Reuses finite-dimensional algebra, tensor
      product, etale/descent, Galois/trace, purely inseparable and spectrum APIs.
      Upstream contributor credit and license notices remain distinct.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned mathlib,
        repository tools and independent non-author agent review.
  notes: >-
    AI-assisted development under human project direction. No model identity,
    expenditure, elapsed-time total or human mathematical review is asserted.

status:
  scope: >-
    Reusable field-base commutative-algebra APIs and checked example clients;
    ambient algebras may be zero or nonreduced. Greatest finite etale
    subalgebras need a supplied uniform natural-number dimension bound.
    Spectrum dimension bounds need a separably closed base and finitely many
    source connected components. Finite-Galois and separable-closure descent
    require coefficientwise stability and their stated extension hypotheses;
    purely inseparable finite-etale reconstruction requires a separably closed
    larger field. Complete source formalization is not claimed.

review:
  status: agent-reviewed
  notes: >-
    Mathematical code, public-module clients and later hypothesis generalization
    received independent non-author agent review. This is not human review,
    source-author endorsement or a source-coverage decision. Generated API
    documentation records historical source bindings, not proof certification.

acknowledgements: >-
  Collective project credit includes Lattice's foundational APIs and integration,
  Anchor's original documentation recipe adapted by Lattice, Folio's mathematical
  headline explanations, and other Formal Frontier AI contributors' exposition,
  descent implementations, examples and API work. Mathlib and other external
  tools retain their own attribution, licenses and notices.
